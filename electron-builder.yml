appId: com.fatkiwi.jbeamforge
productName: JBeam Forge
copyright: Copyright © 2026 Fatkiwi
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asar: true
# Example extensions, installable from Settings → Extensions.
extraResources:
  - from: examples/extensions
    to: example-extensions
  # The tutorial's practice car (scripts/dev/buildDemoCar.mts builds it).
  - from: assets/demo-car
    to: demo-car
  # JBeam Forge inside BeamNG.drive (npm run build:ingame), installed into the game from Settings → BeamNG.
  - from: release/jbeam_forge_ingame.zip
    to: ingame/jbeam_forge.zip
# Textures and meshes are optional downloads from their own repositories (Downloads window;
# npm run build-content-repos builds them), so the installer no longer carries the packs.
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: JBeam-Forge-Setup-${version}.exe
  shortcutName: JBeam Forge
  uninstallDisplayName: JBeam Forge
portable:
  artifactName: JBeam-Forge-${version}-portable.exe
linux:
  icon: build/icon.png
  category: Development
  synopsis: Turn a 3D vehicle model into a BeamNG.drive mod
  description: JBeam Forge turns a 3D car model into an installable BeamNG.drive mod, and runs inside the game on F10.
  maintainer: Connor Moyle <74651514+Connor-Moyle@users.noreply.github.com>
  executableName: jbeam-forge
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
appImage:
  artifactName: JBeam-Forge-${version}.AppImage
deb:
  artifactName: jbeam-forge_${version}_amd64.deb
publish: null
