# Builds the Windows installer and portable exe on GitHub and publishes them
# as a release, tagged v<package.json version>. Runs when that tag is pushed,
# or by hand (Actions → Release → Run workflow), which tags the commit it
# builds. Same result as `npm run release` on a Windows machine. Never
# replaces an existing release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: The version has release notes (and matches the tag, if one was pushed)
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME but package.json says $tag"; exit 1; fi
          test -f "docs/releases/$tag.md" || { echo "No docs/releases/$tag.md"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Refuse to replace an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists; leaving it alone."; exit 1; fi

      - run: npm ci

      - run: npm run typecheck

      - name: Build the installer and portable exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          notes="docs/releases/$TAG.md"
          title="$(head -n 1 "$notes" | sed 's/^#[[:space:]]*//')"
          tail -n +2 "$notes" > release/notes.md
          # Creates the tag on the commit just built when it doesn't exist yet.
          gh release create "$TAG" \
            "release/JBeam-Forge-Setup-$version.exe" \
            "release/JBeam-Forge-$version-portable.exe" \
            --target "$GITHUB_SHA" --title "$title" --notes-file release/notes.md --latest
